name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install the hashed dependency baseline
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Install this checkout without resolving more dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Check dependency metadata
        run: python -m pip check
      - name: Check critical Python errors
        run: python -m ruff check --select E9,F63,F7,F82 src tests scripts
      - name: Run tests without hardware access
        run: python -m pytest -q

  distributions:
    name: Distributions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install the hashed build baseline
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Build the sdist and a wheel from that sdist
        # build's default is sdist -> wheel; separate --sdist/--wheel flags bypass that check.
        run: python -m build --no-isolation
      - name: Verify both distribution archives
        run: python scripts/verify_distribution.py --dist-dir dist
      - name: Verify an isolated installed wheel
        if: runner.os != 'macOS'
        run: python scripts/verify_installed_package.py --dist-dir dist --requirements requirements-dev.lock
      - name: Verify the installed wheel and compile its native helper
        if: runner.os == 'macOS'
        # Compile only: the probe never runs speech capture or requests hardware permissions.
        run: python scripts/verify_installed_package.py --dist-dir dist --requirements requirements-dev.lock --compile-native
